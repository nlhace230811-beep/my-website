<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Kai's Website</title>
  <link rel="stylesheet" href="index.CSS">
</head>
<body>

<header>
  <div class="logo">My Vlog</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#videos">Videos</a>
    <a href="#about">About</a>
  </nav>
</header>

<section class="hero" id="home">
  <h1>Welcome to Kai's Vlog</h1>
  <p>Sharing my life, coding & travel adventures</p>
  <button class="btn" onclick="scrollToVideos()">Watch Videos</button>
</section>

<section class="videos" id="videos">
  <h2>Latest Videos</h2>
  <div class="grid">
    <div class="card" onclick="openVideo('Video 1')">
      <div class="video-box">▶ Video 1</div>
      <img src="">
    </div>
    <div class="card" onclick="openVideo('Video 2')">
      <div class="video-box">▶ Video 2</div>
    </div>
    <div class="card" onclick="openVideo('Video 3')">
      <div class="video-box">▶ Video 3</div>
    </div>
    <div class="card" onclick="openVideo('Video 4')">
      <div class="video-box">▶ Video 4</div>
    </div>
  </div>
</section>

<section class="videos" id="about">
  <h2>About Me</h2>
  <p>I am a vlogger who loves technology, gaming, and travel.</p>
</section>

<footer>
  <p>© 2026 My Vlog. All rights reserved.</p>
</footer>

<script>
  function scrollToVideos() {
    document.getElementById('videos').scrollIntoView({ behavior: 'smooth' });
  }

  function openVideo(name) {
    alert("Opening " + name + " (demo only)");
  }
</script>

</body>
</html>
